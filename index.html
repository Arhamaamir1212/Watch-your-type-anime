
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090014">
    <title>WATCH YOUR TYPE ANIME | Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, #461080 0, transparent 35%),
                radial-gradient(circle at 80% 80%, #003f68 0, transparent 35%),
                #090014;
            overflow-x: hidden;
        }

        .glow {
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .4;
            pointer-events: none;
            animation: float 7s infinite alternate ease-in-out;
        }

        .glow.one {
            background: #a020f0;
            top: 5%;
            left: 5%;
        }

        .glow.two {
            background: #00d9ff;
            bottom: 5%;
            right: 5%;
            animation-delay: -3s;
        }

        @keyframes float {
            from { transform: translateY(-20px); }
            to { transform: translateY(30px); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: rgba(16, 8, 35, .88);
            border: 1px solid rgba(180, 100, 255, .4);
            border-radius: 22px;
            box-shadow: 0 0 45px rgba(142, 45, 226, .2);
            backdrop-filter: blur(15px);
        }

        .logo {
            text-align: center;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 15px #a020f0;
        }

        .logo span {
            color: #00e5ff;
        }

        .subtitle {
            text-align: center;
            color: #bcb1d4;
            margin-bottom: 28px;
            font-size: 14px;
        }

        h1 {
            font-size: 27px;
            text-align: center;
            margin-bottom: 8px;
        }

        .description {
            color: #bcb1d4;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-size: 13px;
            color: #e6dcff;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            color: white;
            background: #130d27;
            border: 1px solid #453064;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: .25s;
        }

        input:focus {
            border-color: #c05cff;
            box-shadow: 0 0 12px rgba(192, 92, 255, .2);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 18px 0;
            color: #c9bedc;
            font-size: 12px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 3px;
            accent-color: #a020f0;
        }

        .terms a,
        .signin a {
            color: #00e5ff;
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #8b25e8, #00bfe8);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 22px rgba(0, 220, 255, .3);
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        #message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .signin {
            margin-top: 22px;
            text-align: center;
            color: #bcb1d4;
            font-size: 13px;
        }

        .footer {
            text-align: center;
            color: #786a94;
            font-size: 11px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            .logo {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="container">
        <div class="logo">WATCH YOUR <span>TYPE</span> ANIME</div>
        <p class="subtitle">YOUR ANIME WORLD STARTS HERE</p>

        <h1>Create Account</h1>
        <p class="description">Join the community and discover your next anime.</p>

        <form id="signupForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                minlength="3"
                maxlength="24"
                autocomplete="username"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="At least 8 characters"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter your password again"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label class="terms">
                <input type="checkbox" id="terms" required>
                <span>I agree to the terms and conditions.</span>
            </label>

            <button type="submit" id="signupButton">CREATE ACCOUNT →</button>
            <div id="message" role="status" aria-live="polite"></div>
        </form>

        <p class="signin">
            Already have an account?
            <a href="signin.html">Sign in</a>
        </p>

        <p class="footer">© 2026 WATCH YOUR TYPE ANIME</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://xezlemrleidboykfpguj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3ongiDvHgGJtRGIEeDogUA_K-58Rbi1";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const form = document.getElementById("signupForm");
        const button = document.getElementById("signupButton");
        const message = document.getElementById("message");

        function showMessage(text, success = false) {
            message.style.display = "block";
            message.style.background = success
                ? "rgba(0, 220, 150, .12)"
                : "rgba(255, 70, 100, .12)";
            message.style.border = success
                ? "1px solid #00dc96"
                : "1px solid #ff4664";
            message.style.color = success ? "#75ffd0" : "#ff9aab";
            message.textContent = text;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (username.length < 3) {
                showMessage("Username must have at least 3 characters.");
                return;
            }

            if (password.length < 8) {
                showMessage("Your password must have at least 8 characters.");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match!");
                return;
            }

            button.disabled = true;
            button.textContent = "CREATING ACCOUNT...";
            message.style.display = "none";

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            username: username
                        },
                        emailRedirectTo:
                            new URL("index.html", window.location.href).href
                    }
                });

                if (error) throw error;

                if (data.session) {
                    showMessage(
                        "Account created successfully! Opening your anime world...",
                        true
                    );

                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1200);
                } else {
                    showMessage(
                        "Account request received! Check your email for the confirmation link.",
                        true
                    );
                }
            } catch (error) {
                showMessage(error.message || "Something went wrong. Please try again.");
            } finally {
                button.disabled = false;
                button.textContent = "CREATE ACCOUNT →";
            }
        });
    </script>
</body>
</html>
